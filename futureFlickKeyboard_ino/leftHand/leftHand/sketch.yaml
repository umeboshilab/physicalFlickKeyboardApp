# arduino-cli のビルド設定（左手）。arduino-cli 1.1 以降で読める。
# - `arduino-cli compile --profile ffkb <このフォルダ>`: 下の ffkb プロファイルの版だけでビルドする。
#   ボード定義とライブラリは arduino-cli が自動で取ってきて、全体に入れたものは使わない。
# - `arduino-cli compile <このフォルダ>`: 全体に入れたボード定義・ライブラリで、default_fqbn のボードとパーティションでビルドする。
# Arduino IDE で書き込むときも、ボード・パーティション・ライブラリの版はここに合わせる。
profiles:
  ffkb:
    notes: 左手ユニット（ESP-WROOM-32）。ESP-NOW で右手へキー番号を送るだけなので、パーティションは既定のままで入る。
    fqbn: esp32:esp32:esp32:PartitionScheme=default
    platforms:
      - platform: esp32:esp32 (1.0.4)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit NeoPixel (1.6.0)
    port_config:
      baudrate: 115200

default_fqbn: esp32:esp32:esp32:PartitionScheme=default
default_port_config:
  baudrate: 115200
